services:
  backend:
    build:
      context: .
      dockerfile: src/UrlShorter.API/Dockerfile
    image: urlshorter-api:latest
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-urlshorter};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-admin}
      - ConnectionStrings__Redis=${REDIS_CONNECTION:-redis:6379}
      - Jwt__Secret=${JWT_SECRET:-change_me_min_32_chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: UrlShorter.FrontEnd/Dockerfile
    image: urlshorter-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-urlshorter}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-urlshorter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
